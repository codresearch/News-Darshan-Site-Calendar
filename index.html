      /* Ensure window.fetch has both getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter" */

        try {

          var _currentFetch = _origFetch
            ? function () {
                return _origFetch.apply(window, arguments);
              }
            : undefined;

          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _currentFetch;
            },
            set: function (fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var _protoFetch = Window.prototype.fetch;
              var _curProto = _protoFetch
                ? function () {
                    return _protoFetch.apply(window, arguments);
                  }
                : undefined;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function () {
                  return _curProto;
                },
                set: function (fn) {
                  _curProto = fn;
                },
                configurable: true,
                enumerable: true,
              });
            }
          } catch (err) {}
        }
      })();
    </script>
